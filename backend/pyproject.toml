[project]
name = "azelux-backend"
version = "0.1.0"
description = "Azelux lunar illumination and Earth-visibility backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "spiceypy>=6.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "httpx>=0.27",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
