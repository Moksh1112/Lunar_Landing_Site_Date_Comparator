name: ci
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  attribution-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check human identity and attribution
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=--root
          fi
          bash scripts/check_attribution.sh "$base" HEAD
  backend:
    runs-on: ubuntu-latest
    env:
      AZX_USE_MOCK: 'true'
      AZX_DATA_DIR: ${{ github.workspace }}/work/ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install uv==0.12.5
      - run: npm run setup
        env:
          AZX_USE_MOCK: 'true'
      - run: npm run check:setup
      - run: npm run check:backend
      - name: Detect Azelux backend handoff
        run: |
          if [ ! -f backend/pyproject.toml ]; then
            echo '::notice::Azelux backend lint/unit tests await backend owner; baseline health only.'
          fi
      - name: Backend owner checks
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        working-directory: backend
        env:
          AZX_USE_MOCK: 'true'
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv run --locked --no-sync ruff check . && uv run --locked --no-sync pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npm run build
        env:
          VITE_USE_MOCK: 'true'
      - name: Frontend owner checks when supplied
        run: |
          if node -e "process.exit(require('./package.json').scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            echo '::notice::Frontend lint script awaits frontend owner; not claimed passed.'
          fi
          if node -e "process.exit(require('./package.json').scripts.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo '::notice::Frontend unit tests await frontend owner; not claimed passed.'
          fi
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  integration-startup:
    runs-on: ubuntu-latest
    env:
      AZX_USE_MOCK: 'true'
      VITE_USE_MOCK: 'true'
      AZX_DATA_DIR: ${{ github.workspace }}/work/ci-data
    strategy:
      fail-fast: false
      matrix:
        mode: [venv, target]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install uv==0.12.5
      - run: npm run setup
        env:
          AZX_PYTHON_MODE: ${{ matrix.mode }}
      - run: npm run check:setup
      - run: npm run check:fixtures
      - run: npm run check:dependencies
      - run: npm run check:startup
      - run: npm run check:backend
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-fixtures.py
